<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rainforest — A Floating Diorama</title>
<style>
  :root {
    --bg: #f0ddc5;
    --ink: #1c2620;
    --muted: #6f8577;
    --accent: #2f7a4f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Georgia', 'Times New Roman', serif;
    overflow: hidden;
    height: 100%; width: 100%;
  }
  #canvas-wrap { position: fixed; inset: 0; z-index: 1; cursor: grab; }
  #canvas-wrap.grabbing { cursor: grabbing; }
  canvas { display: block; }

  #hud {
    position: fixed; inset: 0;
    z-index: 5;
    pointer-events: none;
    padding: 5vh 6vw;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .eyebrow {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #c1552f;
    margin-bottom: 14px;
    font-weight: 700;
  }
  h1 {
    font-size: clamp(2.2rem, 5.5vw, 3.8rem);
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .top p {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 14.5px;
    color: var(--muted);
    max-width: 36ch;
    margin-top: 14px;
    line-height: 1.6;
  }
  .bottom { display: flex; align-items: flex-end; justify-content: space-between; }
  .legend {
    display: flex;
    gap: 26px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #discover-counter {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--ink);
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(10px);
    padding: 10px 18px;
    border-radius: 100px;
    pointer-events: auto;
  }
  #toast {
    position: fixed;
    bottom: 13vh; left: 50%;
    transform: translateX(-50%) translateY(10px);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-style: italic;
    font-size: 15px;
    color: var(--ink);
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(10px);
    padding: 10px 22px;
    border-radius: 100px;
    opacity: 0;
    transition: opacity 0.6s ease, transform 0.6s ease;
    z-index: 6;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #loading {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 50;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--muted);
    transition: opacity 0.8s;
  }
</style>
</head>
<body>

<div id="loading">Growing the Canopy</div>
<div id="canvas-wrap"></div>

<div id="hud">
  <div class="top">
    <div class="eyebrow">A Floating Diorama</div>
    <h1>Rainforest</h1>
    <p>One small jungle, unmoored. Drag to orbit, scroll to lean in, click the shadows to see who's watching back.</p>
  </div>
  <div class="bottom">
    <div class="legend">
      <div>Drag · Orbit</div>
      <div>Scroll · Zoom</div>
      <div>Click · Discover</div>
    </div>
    <div id="discover-counter">Discovered: <span id="discover-count">0</span> / 3</div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
// ================= PALETTE =================
const PALETTE = {
  groundDark: 0x2f5c3a,
  groundLight: 0x3f7a4a,
  rock: 0x5c4a38,
  rockDark: 0x3f3226,
  trunk: 0x5a4632,
  leafDeep: 0x1f5c33,
  leafMid: 0x2f7a42,
  leafLight: 0x4a9455,
  mud: 0x4a4530,
  mudDeep: 0x332f20,
  tigerOrange: 0xe8823c,
  tigerStripe: 0x201812,
  tigerBelly: 0xf5ead2,
  gatorGreen: 0x4f6e42,
  gatorBelly: 0xcfd6b0,
  birdRed: 0xd8503f,
  birdBlue: 0x3f7ea8,
  birdYellow: 0xe8c23c,
  bg: 0xf0ddc5,
};

// ================= SCENE / CAMERA / RENDERER =================
const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
let camDist = 12, camTheta = 0.5, camPhi = 1.1;
function updateCamera() {
  camera.position.set(
    camDist * Math.sin(camPhi) * Math.sin(camTheta),
    camDist * Math.cos(camPhi) + 0.6,
    camDist * Math.sin(camPhi) * Math.cos(camTheta)
  );
  camera.lookAt(0, 0.7, 0);
}
updateCamera();

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(PALETTE.bg, 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ================= LIGHTS (dappled canopy feel) =================
const ambient = new THREE.HemisphereLight(0xcfe8c0, 0x2f3f28, 0.55);
scene.add(ambient);
const key = new THREE.DirectionalLight(0xdfffc8, 1.1);
key.position.set(4, 9, 3);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -6; key.shadow.camera.right = 6;
key.shadow.camera.top = 6; key.shadow.camera.bottom = -6;
scene.add(key);
const rim = new THREE.DirectionalLight(0x6fa87f, 0.5);
rim.position.set(-6, 3, -5);
scene.add(rim);
// a couple of warm "sunbeam" point lights for dappled patches
const beam1 = new THREE.PointLight(0xfff2b8, 0.6, 4);
beam1.position.set(1.2, 2.2, 0.8);
scene.add(beam1);
const beam2 = new THREE.PointLight(0xfff2b8, 0.4, 3);
beam2.position.set(-1.4, 1.8, -0.6);
scene.add(beam2);

// ================= HELPERS =================
function facetMat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color, flatShading: true, roughness: opts.roughness ?? 0.7, metalness: opts.metalness ?? 0.02,
    transparent: opts.transparent ?? false, opacity: opts.opacity ?? 1,
  });
}
function mesh(geo, mat, castShadow = true) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = castShadow; m.receiveShadow = true;
  return m;
}

// ================= FLOATING ISLAND =================
const island = new THREE.Group();
scene.add(island);

const topShape = new THREE.CylinderGeometry(3.3, 3.5, 0.5, 8, 1);
const topMat = facetMat(PALETTE.groundLight, { roughness: 0.85 });
const topSlab = mesh(topShape, topMat);
topSlab.position.y = 0.2;
island.add(topSlab);

const rockShape = new THREE.ConeGeometry(3.3, 4.0, 8, 1);
const rockMat = facetMat(PALETTE.rockDark, { roughness: 0.85 });
const rock = mesh(rockShape, rockMat);
rock.rotation.y = Math.PI / 8;
rock.position.y = -2.0;
island.add(rock);

const ringShape = new THREE.CylinderGeometry(3.4, 3.3, 0.28, 8, 1);
const ringMat = facetMat(PALETTE.rock, { roughness: 0.7 });
const ring = mesh(ringShape, ringMat);
ring.position.y = -0.14;
island.add(ring);

// undergrowth mounds for texture variation
function groundPatch(x, z, s, colorA) {
  const g = new THREE.IcosahedronGeometry(s, 1);
  const m = facetMat(colorA, { roughness: 0.85 });
  const d = mesh(g, m);
  d.scale.set(1, 0.35, 1);
  d.position.set(x, 0.46 + s * 0.15, z);
  island.add(d);
}
groundPatch(1.8, 1.6, 0.5, PALETTE.groundDark);
groundPatch(-2.0, 0.8, 0.4, PALETTE.groundDark);
groundPatch(0.6, -2.2, 0.35, PALETTE.groundDark);

// muddy pond for the alligator
const mudGeo = new THREE.CylinderGeometry(1.1, 1.1, 0.06, 20);
const mudMat = new THREE.MeshStandardMaterial({ color: PALETTE.mud, roughness: 0.35, metalness: 0.1, flatShading: true });
const mud = mesh(mudGeo, mudMat);
mud.position.set(-1.3, 0.47, -1.2);
island.add(mud);
const mudDeepGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.02, 20);
const mudDeepMat = new THREE.MeshStandardMaterial({ color: PALETTE.mudDeep, roughness: 0.4, transparent: true, opacity: 0.7 });
const mudDeep = mesh(mudDeepGeo, mudDeepMat, false);
mudDeep.position.set(-1.3, 0.51, -1.2);
island.add(mudDeep);

// ================= TREES (layered canopy) =================
function tree(x, z, h, spread) {
  const g = new THREE.Group();
  const trunkMat = facetMat(PALETTE.trunk, { roughness: 0.8 });
  const trunk = mesh(new THREE.CylinderGeometry(0.06, 0.09, h, 6), trunkMat);
  trunk.position.y = h / 2;
  g.add(trunk);

  const leafColors = [PALETTE.leafDeep, PALETTE.leafMid, PALETTE.leafLight];
  for (let i = 0; i < 3; i++) {
    const leafMat = facetMat(leafColors[i], { roughness: 0.75 });
    const clump = mesh(new THREE.IcosahedronGeometry(spread * (1 - i * 0.18), 1), leafMat);
    clump.position.set(
      (Math.random() - 0.5) * spread * 0.5,
      h + i * spread * 0.35,
      (Math.random() - 0.5) * spread * 0.5
    );
    g.add(clump);
  }
  g.position.set(x, 0.45, z);
  island.add(g);
  return g;
}
tree(2.2, -0.4, 1.6, 0.75);
tree(-1.8, 1.6, 1.3, 0.6);
tree(0.2, 2.1, 1.8, 0.8);
tree(-2.4, -1.6, 1.4, 0.65);
tree(1.5, 1.7, 1.1, 0.55);

// hanging vines
function vine(x, z, y0, len) {
  const m = facetMat(0x3f6b3a, { roughness: 0.7 });
  const v = mesh(new THREE.CylinderGeometry(0.012, 0.012, len, 5), m, false);
  v.position.set(x, y0 - len / 2, z);
  island.add(v);
  return v;
}
const vines = [
  vine(2.0, 0.2, 2.6, 1.0),
  vine(-0.2, 1.9, 2.9, 1.2),
  vine(-2.0, -1.2, 2.2, 0.9),
];

// sparkle trail off the bottom point
const trailGeo = new THREE.BufferGeometry();
const TRAIL_N = 40;
const trailPos = new Float32Array(TRAIL_N * 3);
for (let i = 0; i < TRAIL_N; i++) {
  const t = i / TRAIL_N;
  trailPos[i*3] = (Math.random() - 0.5) * 0.3 * (1 - t);
  trailPos[i*3+1] = -2.0 - t * 2.2;
  trailPos[i*3+2] = (Math.random() - 0.5) * 0.3 * (1 - t);
}
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
const trailMat = new THREE.PointsMaterial({ color: 0x9fd4a0, size: 0.045, transparent: true, opacity: 0.6 });
const trail = new THREE.Points(trailGeo, trailMat);
island.add(trail);

// ================= FLOATING ROCKS AROUND =================
function floatRock(x, y, z, s) {
  const g = new THREE.IcosahedronGeometry(s, 1);
  const m = facetMat(PALETTE.rock, { roughness: 0.7 });
  const r = mesh(g, m);
  r.position.set(x, y, z);
  r.rotation.set(Math.random(), Math.random(), Math.random());
  r.userData = { baseY: y, phase: Math.random() * 10 };
  scene.add(r);
  const capMat = facetMat(PALETTE.leafMid, { roughness: 0.8 });
  const cap = mesh(new THREE.IcosahedronGeometry(s * 0.55, 0), capMat);
  cap.scale.set(1, 0.5, 1);
  cap.position.set(x, y + s * 0.55, z);
  cap.userData = { baseY: y + s * 0.55, phase: r.userData.phase };
  scene.add(cap);
  return [r, cap];
}
const floatRocks = [
  ...floatRock(-5.4, 0.2, 1.2, 0.45),
  ...floatRock(5.3, -0.2, 1.4, 0.4),
  ...floatRock(0.4, -1.8, -5.5, 0.3),
];

// ================= TIGER (resting, "wakes" when discovered) =================
function buildTiger() {
  const g = new THREE.Group();
  const orange = facetMat(PALETTE.tigerOrange, { roughness: 0.55 });
  const bellyMat = facetMat(PALETTE.tigerBelly, { roughness: 0.55 });
  const stripeMat = facetMat(PALETTE.tigerStripe, { roughness: 0.4 });
  const eyeMat = facetMat(0x1a1310, { roughness: 0.15 });

  const body = mesh(new THREE.IcosahedronGeometry(0.32, 1), orange);
  body.scale.set(1.6, 0.75, 0.9);
  body.position.y = 0.28;
  g.add(body);

  const belly = mesh(new THREE.IcosahedronGeometry(0.18, 1), bellyMat);
  belly.scale.set(1.3, 0.6, 0.55);
  belly.position.set(0.05, 0.2, 0.1);
  g.add(belly);

  // stripe patches
  [[0.25, 0.1], [-0.05, -0.15], [-0.3, 0.12]].forEach(([sx, sz]) => {
    const stripe = mesh(new THREE.IcosahedronGeometry(0.09, 0), stripeMat, false);
    stripe.scale.set(0.4, 1.1, 0.5);
    stripe.position.set(sx, 0.32, sz);
    g.add(stripe);
  });

  const head = mesh(new THREE.IcosahedronGeometry(0.19, 1), orange);
  head.position.set(0.5, 0.34, 0);
  g.add(head);

  [-1, 1].forEach(s => {
    const ear = mesh(new THREE.IcosahedronGeometry(0.055, 0), stripeMat);
    ear.position.set(0.44, 0.5, s * 0.12);
    g.add(ear);
  });

  const eyes = [];
  [-1, 1].forEach(s => {
    const eye = mesh(new THREE.SphereGeometry(0.02, 8, 8), eyeMat, false);
    eye.position.set(0.62, 0.36, s * 0.09);
    eye.scale.y = 0.15; // starts closed
    g.add(eye);
    eyes.push(eye);
  });

  const tail = mesh(new THREE.IcosahedronGeometry(0.06, 0), orange);
  tail.position.set(-0.5, 0.3, 0.05);
  g.add(tail);

  g.userData.eyes = eyes;
  g.userData.head = head;
  return g;
}
const tiger = buildTiger();
tiger.scale.setScalar(0.75);
tiger.position.set(-1.9, 0.55, 1.5);
tiger.rotation.y = 0.6;
tiger.userData.awake = false;
scene.add(tiger);

// ================= ALLIGATOR (half-submerged, surfaces when discovered) =================
function buildGator() {
  const g = new THREE.Group();
  const bodyMat = facetMat(PALETTE.gatorGreen, { roughness: 0.55 });
  const bellyMat = facetMat(PALETTE.gatorBelly, { roughness: 0.5 });
  const eyeMat = facetMat(0xe8c23c, { roughness: 0.2 });
  const pupilMat = facetMat(0x141210, { roughness: 0.1 });

  const body = mesh(new THREE.IcosahedronGeometry(0.22, 1), bodyMat);
  body.scale.set(2.2, 0.5, 0.85);
  body.position.y = 0.12;
  g.add(body);

  const belly = mesh(new THREE.IcosahedronGeometry(0.15, 1), bellyMat, false);
  belly.scale.set(1.9, 0.35, 0.6);
  belly.position.set(0, 0.06, 0.08);
  g.add(belly);

  const snout = mesh(new THREE.IcosahedronGeometry(0.1, 1), bodyMat);
  snout.scale.set(1.8, 0.5, 0.6);
  snout.position.set(0.42, 0.1, 0);
  g.add(snout);

  const eyes = [];
  [-1, 1].forEach(s => {
    const bump = mesh(new THREE.IcosahedronGeometry(0.035, 0), bodyMat, false);
    bump.position.set(0.22, 0.2, s * 0.09);
    g.add(bump);
    const eye = mesh(new THREE.SphereGeometry(0.018, 8, 8), eyeMat, false);
    eye.position.set(0.22, 0.22, s * 0.09);
    g.add(eye);
    const pupil = mesh(new THREE.SphereGeometry(0.008, 6, 6), pupilMat, false);
    pupil.position.set(0.22, 0.22, s * 0.09 + s * 0.008);
    g.add(pupil);
    eyes.push(eye);
  });

  // tail, tapering
  const tail = mesh(new THREE.ConeGeometry(0.16, 0.5, 6), bodyMat);
  tail.rotation.z = Math.PI / 2;
  tail.position.set(-0.55, 0.12, 0);
  g.add(tail);

  g.userData.eyes = eyes;
  return g;
}
const gator = buildGator();
gator.scale.setScalar(0.85);
gator.position.set(-1.5, 0.4, -1.4); // starts low/submerged in the mud
gator.userData.surfaced = false;
scene.add(gator);

// ================= BIRDS (perched, scatter when discovered) =================
function buildBird(color) {
  const g = new THREE.Group();
  const bodyMat = facetMat(color, { roughness: 0.55 });
  const beakMat = facetMat(0xe8a23c, { roughness: 0.4 });
  const eyeMat = facetMat(0x161311, { roughness: 0.15 });

  const body = mesh(new THREE.IcosahedronGeometry(0.07, 1), bodyMat, false);
  body.scale.set(1, 1.1, 0.85);
  g.add(body);

  const head = mesh(new THREE.IcosahedronGeometry(0.045, 1), bodyMat, false);
  head.position.set(0.02, 0.09, 0);
  g.add(head);

  const beak = mesh(new THREE.IcosahedronGeometry(0.018, 0), beakMat, false);
  beak.scale.set(1.4, 0.7, 0.7);
  beak.position.set(0.02, 0.09, 0.055);
  g.add(beak);

  [-1, 1].forEach(s => {
    const eye = mesh(new THREE.SphereGeometry(0.011, 6, 6), eyeMat, false);
    eye.position.set(0.02, 0.1, s * 0.035);
    g.add(eye);
  });

  [-1, 1].forEach(s => {
    const wing = mesh(new THREE.IcosahedronGeometry(0.04, 0), bodyMat, false);
    wing.scale.set(0.5, 1.4, 0.5);
    wing.position.set(0, 0, s * 0.06);
    g.add(wing);
    g.userData['wing' + s] = wing;
  });

  const tail = mesh(new THREE.ConeGeometry(0.03, 0.1, 4), bodyMat, false);
  tail.rotation.z = Math.PI / 2;
  tail.position.set(-0.08, 0, 0);
  g.add(tail);

  return g;
}
const birdColors = [PALETTE.birdRed, PALETTE.birdBlue, PALETTE.birdYellow];
const birdPerches = [
  { x: 2.2, y: 1.7, z: -0.4 },
  { x: 0.2, y: 2.4, z: 2.1 },
  { x: -1.8, y: 1.4, z: 1.6 },
];
const birds = birdColors.map((c, i) => {
  const b = buildBird(c);
  b.position.set(birdPerches[i].x, birdPerches[i].y, birdPerches[i].z);
  b.userData = { perch: birdPerches[i], scattered: false, flightT: 0 };
  scene.add(b);
  return b;
});

// ================= DISCOVERY SYSTEM =================
let discovered = new Set();
function updateDiscoverCount() {
  document.getElementById('discover-count').textContent = discovered.size;
}

function wakeTiger() {
  if (tiger.userData.awake) return;
  tiger.userData.awake = true;
  gsap.to(tiger.userData.eyes[0].scale, { y: 1, duration: 0.4 });
  gsap.to(tiger.userData.eyes[1].scale, { y: 1, duration: 0.4 });
  gsap.to(tiger.userData.head.rotation, { y: -0.3, duration: 0.5, yoyo: true, repeat: 1 });
  discovered.add('tiger');
  updateDiscoverCount();
  showToast('The tiger stirs, watching you.');
}

function surfaceGator() {
  if (gator.userData.surfaced) return;
  gator.userData.surfaced = true;
  gsap.to(gator.position, { y: 0.5, duration: 0.8, ease: 'power2.out' });
  discovered.add('gator');
  updateDiscoverCount();
  showToast('Something surfaces in the mud.');
}

function scatterBirds() {
  const anyNotScattered = birds.some(b => !b.userData.scattered);
  if (!anyNotScattered) return;
  birds.forEach(b => { b.userData.scattered = true; b.userData.flightT = 0; });
  discovered.add('birds');
  updateDiscoverCount();
  showToast('Birds scatter into the canopy.');
}

// ================= INTERACTION =================
let isDragging = false, lastX = 0, lastY = 0, dragged = false;
wrap.addEventListener('mousedown', (e) => {
  isDragging = true; dragged = false; lastX = e.clientX; lastY = e.clientY;
  wrap.classList.add('grabbing');
});
window.addEventListener('mouseup', () => { isDragging = false; wrap.classList.remove('grabbing'); });
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  if (Math.abs(dx) + Math.abs(dy) > 3) dragged = true;
  camTheta -= dx * 0.005;
  camPhi = Math.min(1.45, Math.max(0.55, camPhi - dy * 0.005));
  lastX = e.clientX; lastY = e.clientY;
  updateCamera();
});
wrap.addEventListener('wheel', (e) => {
  camDist = Math.min(17, Math.max(5.5, camDist + e.deltaY * 0.005));
  updateCamera();
}, { passive: true });

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
wrap.addEventListener('click', (e) => {
  if (dragged) return;
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const tigerHits = raycaster.intersectObject(tiger, true);
  if (tigerHits.length) { wakeTiger(); return; }

  const gatorHits = raycaster.intersectObject(gator, true);
  if (gatorHits.length) { surfaceGator(); return; }

  for (const b of birds) {
    const hits = raycaster.intersectObject(b, true);
    if (hits.length) { scatterBirds(); return; }
  }
});

let toastTimeout;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => el.classList.remove('show'), 2600);
}

// ================= LOOP =================
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();

  island.rotation.y = Math.sin(t * 0.08) * 0.02;
  island.position.y = Math.sin(t * 0.35) * 0.08;

  floatRocks.forEach(r => {
    r.position.y = r.userData.baseY + Math.sin(t * 0.6 + r.userData.phase) * 0.15;
    r.rotation.y += dt * 0.04;
  });

  vines.forEach((v, i) => { v.rotation.z = Math.sin(t * 0.8 + i) * 0.04; });

  // dappled light drift
  beam1.position.x = 1.2 + Math.sin(t * 0.3) * 0.4;
  beam2.position.z = -0.6 + Math.cos(t * 0.25) * 0.4;

  // tiger idle breathing
  if (!tiger.userData.awake) {
    tiger.children[0].scale.y = 0.75 + Math.sin(t * 1.5) * 0.02;
  } else {
    tiger.rotation.y = 0.6 + Math.sin(t * 0.4) * 0.1;
  }

  // gator idle bob once surfaced
  if (gator.userData.surfaced) {
    gator.position.y = 0.5 + Math.sin(t * 0.8) * 0.03;
  }

  // birds: perched idle bob, or scattered flight loop
  birds.forEach(b => {
    const flap = Math.sin(t * 25) * 0.5;
    if (b.userData['wing1']) b.userData['wing1'].rotation.z = flap;
    if (b.userData['wing-1']) b.userData['wing-1'].rotation.z = -flap;

    if (!b.userData.scattered) {
      b.position.y = island.position.y + b.userData.perch.y + Math.sin(t * 2 + b.userData.perch.x) * 0.01;
    } else {
      b.userData.flightT += dt;
      const ft = b.userData.flightT;
      const orbitR = 2.0;
      const ang = ft * 1.2 + b.userData.perch.x;
      b.position.set(
        Math.cos(ang) * orbitR,
        island.position.y + b.userData.perch.y + 0.6 + Math.sin(ft * 2) * 0.15,
        Math.sin(ang) * orbitR
      );
      b.rotation.y = -ang + Math.PI / 2;
      // settle back to perch after a while
      if (ft > 4) {
        b.userData.scattered = false;
        b.userData.flightT = 0;
      }
    }
  });

  updateCamera();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('load', () => {
  setTimeout(() => {
    const l = document.getElementById('loading');
    l.style.opacity = '0';
    setTimeout(() => l.style.display = 'none', 800);
  }, 500);
});
</script>
