<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bird Paradise — A Floating Diorama</title>
<style>
  :root {
    --bg-a: #bfe4f5;
    --bg-b: #ffdca0;
    --ink: #3a2618;
    --muted: #9a7a5c;
    --accent: #c1552f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: linear-gradient(180deg, var(--bg-a) 0%, var(--bg-b) 100%);
    color: var(--ink);
    font-family: 'Georgia', 'Times New Roman', serif;
    overflow: hidden;
    height: 100%; width: 100%;
  }
  #canvas-wrap { position: fixed; inset: 0; z-index: 1; cursor: grab; }
  #canvas-wrap.grabbing { cursor: grabbing; }
  canvas { display: block; }

  #hud {
    position: fixed; inset: 0;
    z-index: 5;
    pointer-events: none;
    padding: 5vh 6vw;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .eyebrow {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
    font-weight: 700;
  }
  h1 {
    font-size: clamp(2.2rem, 5.5vw, 3.8rem);
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .top p {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 14.5px;
    color: var(--muted);
    max-width: 36ch;
    margin-top: 14px;
    line-height: 1.6;
  }
  .bottom { display: flex; align-items: flex-end; justify-content: space-between; }
  .legend {
    display: flex;
    gap: 26px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #feed-counter {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--ink);
    background: rgba(255,255,255,0.45);
    backdrop-filter: blur(10px);
    padding: 10px 18px;
    border-radius: 100px;
    pointer-events: auto;
  }
  #toast {
    position: fixed;
    bottom: 13vh; left: 50%;
    transform: translateX(-50%) translateY(10px);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-style: italic;
    font-size: 15px;
    color: var(--ink);
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(10px);
    padding: 10px 22px;
    border-radius: 100px;
    opacity: 0;
    transition: opacity 0.6s ease, transform 0.6s ease;
    z-index: 6;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #loading {
    position: fixed; inset: 0;
    background: var(--bg-a);
    z-index: 50;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--muted);
    transition: opacity 0.8s;
  }
</style>
</head>
<body>

<div id="loading">Catching the Sunrise</div>
<div id="canvas-wrap"></div>

<div id="hud">
  <div class="top">
    <div class="eyebrow">A Floating Diorama</div>
    <h1>Bird Paradise</h1>
    <p>One small cliff, unmoored, crowned by a nest. Drag to orbit, scroll to lean in, click the nest to call the eagle home.</p>
  </div>
  <div class="bottom">
    <div class="legend">
      <div>Drag · Orbit</div>
      <div>Scroll · Zoom</div>
      <div>Click Nest · Call Eagle</div>
      <div>Click Feeder · Fill Dish</div>
    </div>
    <div style="display:flex; gap:10px;">
      <div id="feed-counter">Feedings: <span id="feed-count">0</span></div>
      <div id="feed-counter">Birds fed: <span id="birds-fed-count">0</span></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
// ================= PALETTE =================
const PALETTE = {
  cliffLight: 0xc98f5c,
  cliffDark: 0x8f5c3a,
  cliffRock: 0xa8724a,
  grassTop: 0x9aa85c,
  grassShade: 0x7a8a42,
  trunk: 0x6b4a30,
  leafDeep: 0x6a7a2f,
  leafMid: 0x8a9a3f,
  leafLight: 0xb0b850,
  nestBrown: 0x7a5834,
  nestBrownDark: 0x5c4224,
  eagleBrown: 0x5c3f2c,
  eagleWhite: 0xf5f0e0,
  eagleBeak: 0xe8c23c,
  chickFluff: 0xe0d4b0,
  bg: 0xffe0a8,
};

// ================= SCENE / CAMERA / RENDERER =================
const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
let camDist = 13, camTheta = 0.45, camPhi = 1.05;
function updateCamera() {
  camera.position.set(
    camDist * Math.sin(camPhi) * Math.sin(camTheta),
    camDist * Math.cos(camPhi) + 1.0,
    camDist * Math.sin(camPhi) * Math.cos(camTheta)
  );
  camera.lookAt(0, 1.2, 0);
}
updateCamera();

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(PALETTE.bg, 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ================= LIGHTS (sunrise gold) =================
const ambient = new THREE.HemisphereLight(0xdff3ff, 0xd8a86a, 0.95);
scene.add(ambient);
const key = new THREE.DirectionalLight(0xffe0a0, 1.7);
key.position.set(6, 5, 3);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -6; key.shadow.camera.right = 6;
key.shadow.camera.top = 6; key.shadow.camera.bottom = -6;
scene.add(key);
const rim = new THREE.DirectionalLight(0xffc98a, 0.9);
rim.position.set(-5, 4, -6);
scene.add(rim);
const fill = new THREE.DirectionalLight(0xbfe4ff, 0.5);
fill.position.set(-3, 2, 5);
scene.add(fill);

// ================= HELPERS =================
function facetMat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color, flatShading: true, roughness: opts.roughness ?? 0.7, metalness: opts.metalness ?? 0.02,
    transparent: opts.transparent ?? false, opacity: opts.opacity ?? 1,
  });
}
function mesh(geo, mat, castShadow = true) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = castShadow; m.receiveShadow = true;
  return m;
}

// ================= FLOATING ISLAND =================
const island = new THREE.Group();
scene.add(island);

const topShape = new THREE.CylinderGeometry(3.2, 3.4, 0.5, 8, 1);
const topMat = facetMat(PALETTE.grassTop, { roughness: 0.8 });
const topSlab = mesh(topShape, topMat);
topSlab.position.y = 0.2;
island.add(topSlab);

const rockShape = new THREE.ConeGeometry(3.2, 4.2, 8, 1);
const rockMat = facetMat(PALETTE.cliffDark, { roughness: 0.85 });
const rock = mesh(rockShape, rockMat);
rock.rotation.y = Math.PI / 8;
rock.position.y = -2.1;
island.add(rock);

const ringShape = new THREE.CylinderGeometry(3.3, 3.2, 0.28, 8, 1);
const ringMat = facetMat(PALETTE.cliffRock, { roughness: 0.75 });
const ring = mesh(ringShape, ringMat);
ring.position.y = -0.14;
island.add(ring);

// cliff outcrop rising on one side
const cliffGeo = new THREE.ConeGeometry(1.1, 2.0, 6, 1);
const cliffMat = facetMat(PALETTE.cliffLight, { roughness: 0.75 });
const cliff = mesh(cliffGeo, cliffMat);
cliff.position.set(-1.4, 1.4, -0.8);
cliff.rotation.y = 0.4;
island.add(cliff);
const cliffFlat = mesh(new THREE.CylinderGeometry(0.5, 0.6, 0.2, 6), facetMat(PALETTE.cliffRock, { roughness: 0.7 }));
cliffFlat.position.set(-1.4, 2.3, -0.8);
island.add(cliffFlat);

// grass mounds for texture
function grassMound(x, z, s) {
  const g = new THREE.IcosahedronGeometry(s, 1);
  const m = facetMat(PALETTE.grassShade, { roughness: 0.8 });
  const d = mesh(g, m);
  d.scale.set(1, 0.4, 1);
  d.position.set(x, 0.46 + s * 0.18, z);
  island.add(d);
}
grassMound(1.8, 1.2, 0.4);
grassMound(1.2, -1.8, 0.32);

// ================= FEEDER (post with seed dish + water dish) =================
const feederGroup = new THREE.Group();
const postMat = facetMat(PALETTE.trunk, { roughness: 0.75 });
const post = mesh(new THREE.CylinderGeometry(0.045, 0.06, 1.1, 6), postMat);
post.position.y = 0.55;
feederGroup.add(post);

const armMat = postMat;
const arm = mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.7, 5), armMat);
arm.rotation.z = Math.PI / 2;
arm.position.set(0, 1.05, 0);
feederGroup.add(arm);

// seed dish (warm terracotta bowl) on one side
const seedDishMat = facetMat(0xc1552f, { roughness: 0.6 });
const seedDish = mesh(new THREE.CylinderGeometry(0.16, 0.11, 0.08, 8), seedDishMat);
seedDish.position.set(0.32, 1.02, 0);
feederGroup.add(seedDish);
const seedPileMat = facetMat(0xe8c23c, { roughness: 0.7 });
const seedPile = mesh(new THREE.IcosahedronGeometry(0.08, 0), seedPileMat, false);
seedPile.scale.set(1, 0.5, 1);
seedPile.position.set(0.32, 1.08, 0);
seedPile.visible = false;
feederGroup.add(seedPile);

// water dish (pale blue bowl) on the other side
const waterDishMat = facetMat(0xdce6e0, { roughness: 0.5 });
const waterDish = mesh(new THREE.CylinderGeometry(0.16, 0.11, 0.08, 8), waterDishMat);
waterDish.position.set(-0.32, 1.02, 0);
feederGroup.add(waterDish);
const waterFillMat = new THREE.MeshStandardMaterial({ color: 0x4f9fd6, roughness: 0.15, metalness: 0.25, flatShading: true, transparent: true, opacity: 0.85 });
const waterFill = mesh(new THREE.CylinderGeometry(0.13, 0.09, 0.03, 8), waterFillMat, false);
waterFill.position.set(-0.32, 1.06, 0);
waterFill.visible = false;
feederGroup.add(waterFill);

// small roof over the feeder for a cottage-feeder look
const roofMat = facetMat(PALETTE.nestBrownDark, { roughness: 0.8 });
const roof = mesh(new THREE.ConeGeometry(0.5, 0.28, 4), roofMat);
roof.rotation.y = Math.PI / 4;
roof.position.set(0, 1.28, 0);
feederGroup.add(roof);

feederGroup.position.set(1.9, 0.45, 1.1);
island.add(feederGroup);

// generous invisible hitboxes so clicking near each dish registers
function makeHitbox(localPos, radius) {
  const hb = new THREE.Mesh(new THREE.SphereGeometry(radius, 8, 8), new THREE.MeshBasicMaterial({ visible: false }));
  hb.position.copy(localPos);
  feederGroup.add(hb);
  return hb;
}
const seedHitbox = makeHitbox(seedDish.position, 0.3);
const waterHitbox = makeHitbox(waterDish.position, 0.3);

// ================= CENTRAL TREE + NEST =================
const centralTree = new THREE.Group();
const trunkMat = facetMat(PALETTE.trunk, { roughness: 0.8 });
const trunk = mesh(new THREE.CylinderGeometry(0.16, 0.24, 3.4, 7), trunkMat);
trunk.position.y = 1.7;
centralTree.add(trunk);

const leafColors = [PALETTE.leafDeep, PALETTE.leafMid, PALETTE.leafLight];
const canopyClumps = [];
for (let i = 0; i < 4; i++) {
  const leafMat = facetMat(leafColors[i % 3], { roughness: 0.75 });
  const clump = mesh(new THREE.IcosahedronGeometry(0.85 - i * 0.08, 1), leafMat);
  clump.position.set(
    (Math.random() - 0.5) * 0.9,
    2.6 + i * 0.35,
    (Math.random() - 0.5) * 0.9
  );
  centralTree.add(clump);
  canopyClumps.push(clump);
}
centralTree.position.set(0.3, 0.45, 0.2);
island.add(centralTree);

// nest — a torus-ish ring of small twig blobs, sitting atop the canopy
const nestGroup = new THREE.Group();
const nestMat = facetMat(PALETTE.nestBrown, { roughness: 0.85 });
const NEST_TWIGS = 14;
for (let i = 0; i < NEST_TWIGS; i++) {
  const a = (i / NEST_TWIGS) * Math.PI * 2;
  const twig = mesh(new THREE.CylinderGeometry(0.025, 0.03, 0.5, 4), nestMat, false);
  twig.position.set(Math.cos(a) * 0.35, Math.sin(i) * 0.03, Math.sin(a) * 0.35);
  twig.rotation.y = a;
  twig.rotation.z = Math.PI / 2.1;
  nestGroup.add(twig);
}
const nestBase = mesh(new THREE.CylinderGeometry(0.4, 0.45, 0.15, 10), facetMat(PALETTE.nestBrownDark, { roughness: 0.85 }));
nestBase.position.y = -0.08;
nestGroup.add(nestBase);
nestGroup.position.set(0.3, 3.9, 0.2);
island.add(nestGroup);

// nest hitbox — bigger invisible sphere so clicking near the nest is forgiving
const nestHitbox = new THREE.Mesh(
  new THREE.SphereGeometry(0.6, 8, 8),
  new THREE.MeshBasicMaterial({ visible: false })
);
nestHitbox.position.copy(nestGroup.position);
island.add(nestHitbox);

// sparkle trail off the bottom point
const trailGeo = new THREE.BufferGeometry();
const TRAIL_N = 40;
const trailPos = new Float32Array(TRAIL_N * 3);
for (let i = 0; i < TRAIL_N; i++) {
  const tt = i / TRAIL_N;
  trailPos[i*3] = (Math.random() - 0.5) * 0.3 * (1 - tt);
  trailPos[i*3+1] = -2.1 - tt * 2.2;
  trailPos[i*3+2] = (Math.random() - 0.5) * 0.3 * (1 - tt);
}
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
const trailMat = new THREE.PointsMaterial({ color: 0xffdca0, size: 0.045, transparent: true, opacity: 0.6 });
const trail = new THREE.Points(trailGeo, trailMat);
island.add(trail);

// ================= FLOATING ROCKS AROUND =================
function floatRock(x, y, z, s) {
  const g = new THREE.IcosahedronGeometry(s, 1);
  const m = facetMat(PALETTE.cliffRock, { roughness: 0.7 });
  const r = mesh(g, m);
  r.position.set(x, y, z);
  r.rotation.set(Math.random(), Math.random(), Math.random());
  r.userData = { baseY: y, phase: Math.random() * 10 };
  scene.add(r);
  const capMat = facetMat(PALETTE.grassShade, { roughness: 0.8 });
  const cap = mesh(new THREE.IcosahedronGeometry(s * 0.55, 0), capMat);
  cap.scale.set(1, 0.5, 1);
  cap.position.set(x, y + s * 0.55, z);
  cap.userData = { baseY: y + s * 0.55, phase: r.userData.phase };
  scene.add(cap);
  return [r, cap];
}
const floatRocks = [
  ...floatRock(-5.6, 0.4, 1.4, 0.4),
  ...floatRock(5.5, -0.1, 1.0, 0.36),
  ...floatRock(0.5, -1.6, -5.6, 0.3),
];

// ================= EAGLE (built larger/detailed since it's the centerpiece) =================
function buildEagle() {
  const g = new THREE.Group();
  const brown = facetMat(PALETTE.eagleBrown, { roughness: 0.5 });
  const white = facetMat(PALETTE.eagleWhite, { roughness: 0.5 });
  const beakMat = facetMat(PALETTE.eagleBeak, { roughness: 0.3 });
  const eyeMat = facetMat(0x161311, { roughness: 0.15 });

  const body = mesh(new THREE.IcosahedronGeometry(0.22, 1), brown);
  body.scale.set(1, 1.5, 0.85);
  g.add(body);

  const head = mesh(new THREE.IcosahedronGeometry(0.13, 1), white);
  head.position.set(0.02, 0.34, 0);
  g.add(head);

  const beak = mesh(new THREE.IcosahedronGeometry(0.04, 0), beakMat, false);
  beak.scale.set(1.6, 0.7, 0.7);
  beak.position.set(0.02, 0.32, 0.13);
  g.add(beak);

  [-1, 1].forEach(s => {
    const eye = mesh(new THREE.SphereGeometry(0.024, 8, 8), eyeMat, false);
    eye.position.set(0.02, 0.37, s * 0.08);
    g.add(eye);
  });

  // wings — flat angular panels, foldable for perch/flight poses
  const wingMat = brown;
  const wingL = mesh(new THREE.ConeGeometry(0.14, 0.5, 4), wingMat, false);
  wingL.rotation.z = Math.PI / 2;
  wingL.rotation.y = 0.2;
  wingL.position.set(-0.05, 0.05, 0.24);
  g.add(wingL);
  const wingR = mesh(new THREE.ConeGeometry(0.14, 0.5, 4), wingMat, false);
  wingR.rotation.z = Math.PI / 2;
  wingR.rotation.y = -0.2;
  wingR.position.set(-0.05, 0.05, -0.24);
  g.add(wingR);

  const tail = mesh(new THREE.ConeGeometry(0.1, 0.28, 4), white, false);
  tail.rotation.x = Math.PI / 2;
  tail.position.set(-0.28, -0.05, 0);
  g.add(tail);

  g.userData.wingL = wingL;
  g.userData.wingR = wingR;
  g.userData.head = head;
  return g;
}
const eagle = buildEagle();
eagle.scale.setScalar(1.0);
const eaglePerch = { x: -1.4, y: 2.65, z: -0.8 }; // on the cliff outcrop
eagle.position.set(eaglePerch.x, eaglePerch.y, eaglePerch.z);
eagle.rotation.y = 1.2;
Object.assign(eagle.userData, { state: 'perched', flightT: 0 });
scene.add(eagle);

// ================= BIG EAGLE — circles the island on its own, occasionally dips to the nest =================
const bigEagle = buildEagle();
bigEagle.scale.setScalar(2.0);
Object.assign(bigEagle.userData, {
  state: 'circling', // circling | toNest | atNest | toCircle
  orbitR: 5.5,
  orbitSpeed: 0.12,
  orbitAngle: 0,
  height: 5.2,
  visitT: 0,
  nextVisitAt: 6 + Math.random() * 8, // seconds of circling before first nest visit
  elapsed: 0,
});
scene.add(bigEagle);

// ================= CHICKS (in the nest) =================
function buildChick() {
  const g = new THREE.Group();
  const fluff = facetMat(PALETTE.chickFluff, { roughness: 0.8 });
  const beakMat = facetMat(PALETTE.eagleBeak, { roughness: 0.4 });
  const eyeMat = facetMat(0x161311, { roughness: 0.15 });

  const body = mesh(new THREE.IcosahedronGeometry(0.09, 1), fluff, false);
  g.add(body);

  const beak = mesh(new THREE.IcosahedronGeometry(0.025, 0), beakMat, false);
  beak.scale.set(1.4, 0.8, 0.8);
  beak.position.set(0, 0.02, 0.08);
  g.add(beak);

  [-1, 1].forEach(s => {
    const eye = mesh(new THREE.SphereGeometry(0.013, 6, 6), eyeMat, false);
    eye.position.set(s * 0.045, 0.04, 0.06);
    g.add(eye);
  });

  return g;
}
const chicks = [buildChick(), buildChick()];
chicks[0].position.set(0.15, 3.95, 0.15);
chicks[1].position.set(0.45, 3.95, 0.3);
chicks.forEach(c => { c.userData = { baseY: c.position.y, phase: Math.random() * 10 }; island.add(c); });

// ================= SMALLER BIRDS (perched around) =================
function buildSmallBird(color) {
  const g = new THREE.Group();
  const bodyMat = facetMat(color, { roughness: 0.55 });
  const beakMat = facetMat(0xe8a23c, { roughness: 0.4 });
  const eyeMat = facetMat(0x161311, { roughness: 0.15 });

  const body = mesh(new THREE.IcosahedronGeometry(0.06, 1), bodyMat, false);
  body.scale.set(1, 1.1, 0.85);
  g.add(body);

  const head = mesh(new THREE.IcosahedronGeometry(0.04, 1), bodyMat, false);
  head.position.set(0.02, 0.08, 0);
  g.add(head);

  const beak = mesh(new THREE.IcosahedronGeometry(0.015, 0), beakMat, false);
  beak.scale.set(1.4, 0.7, 0.7);
  beak.position.set(0.02, 0.08, 0.05);
  g.add(beak);

  [-1, 1].forEach(s => {
    const eye = mesh(new THREE.SphereGeometry(0.009, 6, 6), eyeMat, false);
    eye.position.set(0.02, 0.09, s * 0.03);
    g.add(eye);
  });

  [-1, 1].forEach(s => {
    const wing = mesh(new THREE.IcosahedronGeometry(0.035, 0), bodyMat, false);
    wing.scale.set(0.5, 1.4, 0.5);
    wing.position.set(0, 0, s * 0.05);
    g.add(wing);
    g.userData['wing' + s] = wing;
  });

  return g;
}
const smallBirdColors = [0xd8503f, 0x3f7ea8, 0xe8c23c, 0x8a5cc9];
const smallBirdPerches = [
  { x: 0.8, y: 2.5, z: 0.6 },
  { x: -0.3, y: 2.9, z: 0.9 },
  { x: 1.1, y: 3.1, z: -0.4 },
  { x: -0.6, y: 2.4, z: -0.5 },
];
const smallBirds = smallBirdColors.map((c, i) => {
  const b = buildSmallBird(c);
  b.position.set(smallBirdPerches[i].x, smallBirdPerches[i].y, smallBirdPerches[i].z);
  Object.assign(b.userData, { perch: smallBirdPerches[i], bob: Math.random() * 10 });
  island.add(b);
  return b;
});

// ================= FLOCK — continuously flying birds, so the sky isn't empty =================
const flockColors = [0xd8503f, 0x3f7ea8, 0xe8c23c, 0x8a5cc9, 0xe87ba0, 0x5cb87a];
const flock = flockColors.map((c, i) => {
  const b = buildSmallBird(c);
  b.scale.setScalar(0.9 + Math.random() * 0.4);
  Object.assign(b.userData, {
    orbitR: 3.2 + Math.random() * 2.2,
    orbitSpeed: 0.25 + Math.random() * 0.25,
    orbitPhase: (i / flockColors.length) * Math.PI * 2,
    height: 2.8 + Math.random() * 1.8,
    bobPhase: Math.random() * 10,
    swoop: Math.random() * 0.6,
    state: 'flying', // flying | toFeeder | pecking | toFlock
    visitT: 0,
  });
  scene.add(b);
  return b;
});

// ================= FEEDING MECHANIC =================
let feedCount = 0;
function updateFeedCount() {
  document.getElementById('feed-count').textContent = feedCount;
}
let toastTimeout;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => el.classList.remove('show'), 2600);
}

function callEagle() {
  if (eagle.userData.state !== 'perched') return;
  eagle.userData.state = 'flying_in';
  eagle.userData.flightT = 0;
  eagle.userData.startPos = eagle.position.clone();
  showToast('The eagle takes wing.');
}

let birdsFedCount = 0;
function updateBirdsFedCount() {
  document.getElementById('birds-fed-count').textContent = birdsFedCount;
}

function fillDish(kind) {
  // kind: 'seed' or 'water'
  if (kind === 'seed') { seedPile.visible = true; } else { waterFill.visible = true; }

  // prefer a bird that's already just flying loops; otherwise interrupt any bird so a click always does something
  const candidate = flock.find(b => b.userData.state === 'flying') || flock[Math.floor(Math.random() * flock.length)];
  candidate.userData.state = 'toFeeder';
  candidate.userData.visitT = 0;
  candidate.userData.visitKind = kind;
  candidate.userData.startPos = candidate.position.clone();
  showToast(kind === 'seed' ? 'A bird swoops toward the seed.' : 'A bird stops for water.');
}

// ================= INTERACTION =================
let isDragging = false, lastX = 0, lastY = 0, dragged = false;
wrap.addEventListener('mousedown', (e) => {
  isDragging = true; dragged = false; lastX = e.clientX; lastY = e.clientY;
  wrap.classList.add('grabbing');
});
window.addEventListener('mouseup', () => { isDragging = false; wrap.classList.remove('grabbing'); });
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  if (Math.abs(dx) + Math.abs(dy) > 3) dragged = true;
  camTheta -= dx * 0.005;
  camPhi = Math.min(1.4, Math.max(0.5, camPhi - dy * 0.005));
  lastX = e.clientX; lastY = e.clientY;
  updateCamera();
});
wrap.addEventListener('wheel', (e) => {
  camDist = Math.min(18, Math.max(6, camDist + e.deltaY * 0.005));
  updateCamera();
}, { passive: true });

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
wrap.addEventListener('click', (e) => {
  if (dragged) return;
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObject(nestHitbox);
  if (hits.length) { callEagle(); return; }

  const seedHits = raycaster.intersectObject(seedHitbox);
  if (seedHits.length) { fillDish('seed'); return; }

  const waterHits = raycaster.intersectObject(waterHitbox);
  if (waterHits.length) { fillDish('water'); return; }
});

// ================= LOOP =================
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();

  island.rotation.y = Math.sin(t * 0.08) * 0.02;
  island.position.y = Math.sin(t * 0.35) * 0.08;

  floatRocks.forEach(r => {
    r.position.y = r.userData.baseY + Math.sin(t * 0.6 + r.userData.phase) * 0.15;
    r.rotation.y += dt * 0.04;
  });

  canopyClumps.forEach((c, i) => { c.rotation.y += dt * 0.01 * (i % 2 === 0 ? 1 : -1); });

  // chicks idle bob + chirp when eagle is feeding
  const eagleFeeding = eagle.userData.state === 'feeding';
  chicks.forEach((c, i) => {
    const chirp = eagleFeeding ? Math.abs(Math.sin(t * 10 + i)) * 0.08 : 0;
    c.position.y = island.position.y + c.userData.baseY + Math.sin(t * 2 + c.userData.phase) * 0.008 + chirp;
  });

  // small birds idle bob + wing flick
  smallBirds.forEach(b => {
    b.position.y = island.position.y + b.userData.perch.y + Math.sin(t * 2.5 + b.userData.bob) * 0.01;
    const flick = Math.sin(t * 6 + b.userData.bob) > 0.85 ? 0.4 : 0;
    if (b.userData.wing1) b.userData.wing1.rotation.z = flick;
    if (b.userData['wing-1']) b.userData['wing-1'].rotation.z = -flick;
  });

  // flock — continuously flying, swooping loops around the island, or visiting the feeder
  const feederWorldPos = new THREE.Vector3();
  flock.forEach(b => {
    const ud = b.userData;

    if (ud.state === 'flying') {
      const ang = t * ud.orbitSpeed + ud.orbitPhase;
      const swoopY = Math.sin(t * 0.6 + ud.bobPhase) * ud.swoop;
      b.position.set(
        Math.cos(ang) * ud.orbitR,
        island.position.y + ud.height + swoopY,
        Math.sin(ang) * ud.orbitR * 0.75
      );
      const nextAng = ang + 0.05;
      const nx = Math.cos(nextAng) * ud.orbitR;
      const nz = Math.sin(nextAng) * ud.orbitR * 0.75;
      b.rotation.y = Math.atan2(nx - b.position.x, nz - b.position.z);
      b.rotation.z = Math.sin(t * 3 + ud.bobPhase) * 0.15;
      const flap = Math.sin(t * 22 + ud.bobPhase) * 0.7;
      if (b.userData.wing1) b.userData.wing1.rotation.z = flap;
      if (b.userData['wing-1']) b.userData['wing-1'].rotation.z = -flap;

    } else if (ud.state === 'toFeeder') {
      ud.visitT += dt;
      const dur = 1.0;
      const p = Math.min(1, ud.visitT / dur);
      const dish = ud.visitKind === 'seed' ? seedDish : waterDish;
      dish.getWorldPosition(feederWorldPos);
      feederWorldPos.y += 0.12;
      b.position.lerpVectors(ud.startPos, feederWorldPos, p);
      b.position.y += Math.sin(p * Math.PI) * 0.6;
      b.rotation.y = Math.atan2(feederWorldPos.x - ud.startPos.x, feederWorldPos.z - ud.startPos.z);
      const flap = Math.sin(t * 22) * 0.7;
      if (b.userData.wing1) b.userData.wing1.rotation.z = flap;
      if (b.userData['wing-1']) b.userData['wing-1'].rotation.z = -flap;
      if (p >= 1) { ud.state = 'pecking'; ud.visitT = 0; }

    } else if (ud.state === 'pecking') {
      ud.visitT += dt;
      b.position.y += Math.sin(t * 14) * 0.002;
      b.rotation.x = Math.sin(t * 10) * 0.15;
      if (ud.visitT > 1.1) {
        b.rotation.x = 0;
        birdsFedCount++; updateBirdsFedCount();
        if (ud.visitKind === 'seed') seedPile.visible = false; else waterFill.visible = false;
        ud.state = 'toFlock'; ud.visitT = 0; ud.startPos = b.position.clone();
      }

    } else if (ud.state === 'toFlock') {
      ud.visitT += dt;
      const dur = 1.0;
      const p = Math.min(1, ud.visitT / dur);
      const ang = t * ud.orbitSpeed + ud.orbitPhase;
      const target = new THREE.Vector3(
        Math.cos(ang) * ud.orbitR,
        island.position.y + ud.height,
        Math.sin(ang) * ud.orbitR * 0.75
      );
      b.position.lerpVectors(ud.startPos, target, p);
      b.position.y += Math.sin(p * Math.PI) * 0.5;
      b.rotation.y = Math.atan2(target.x - ud.startPos.x, target.z - ud.startPos.z);
      const flap = Math.sin(t * 22) * 0.7;
      if (b.userData.wing1) b.userData.wing1.rotation.z = flap;
      if (b.userData['wing-1']) b.userData['wing-1'].rotation.z = -flap;
      if (p >= 1) ud.state = 'flying';
    }
  });

  // eagle state machine
  const ed = eagle.userData;
  if (ed.state === 'perched') {
    eagle.position.y = eaglePerch.y + island.position.y - 0.45 + Math.sin(t * 1.5) * 0.01;
    if (eagle.userData.wingL) {
      eagle.userData.wingL.rotation.x = Math.sin(t * 1.2) * 0.03;
      eagle.userData.wingR.rotation.x = -Math.sin(t * 1.2) * 0.03;
    }
  } else if (ed.state === 'flying_in') {
    ed.flightT += dt;
    const dur = 1.4;
    const p = Math.min(1, ed.flightT / dur);
    const arcHeight = 1.2;
    const nestPos = nestGroup.position.clone();
    nestPos.y += island.position.y - 0.45 + 0.35;
    eagle.position.lerpVectors(ed.startPos, nestPos, p);
    eagle.position.y += Math.sin(p * Math.PI) * arcHeight;
    eagle.rotation.y = Math.atan2(nestPos.x - ed.startPos.x, nestPos.z - ed.startPos.z);
    // wing flap during flight
    eagle.userData.wingL.rotation.x = Math.sin(t * 18) * 0.6;
    eagle.userData.wingR.rotation.x = -Math.sin(t * 18) * 0.6;
    if (p >= 1) {
      ed.state = 'feeding'; ed.flightT = 0;
      feedCount++; updateFeedCount();
      showToast('The eagle feeds its chicks.');
    }
  } else if (ed.state === 'feeding') {
    ed.flightT += dt;
    eagle.userData.head.rotation.x = Math.sin(t * 8) * 0.15;
    eagle.userData.wingL.rotation.x = Math.sin(t * 1.5) * 0.03;
    eagle.userData.wingR.rotation.x = -Math.sin(t * 1.5) * 0.03;
    if (ed.flightT > 2.0) {
      ed.state = 'flying_out'; ed.flightT = 0;
      ed.startPos = eagle.position.clone();
    }
  } else if (ed.state === 'flying_out') {
    ed.flightT += dt;
    const dur = 1.4;
    const p = Math.min(1, ed.flightT / dur);
    const arcHeight = 1.0;
    const perchPos = new THREE.Vector3(eaglePerch.x, eaglePerch.y + island.position.y - 0.45, eaglePerch.z);
    eagle.position.lerpVectors(ed.startPos, perchPos, p);
    eagle.position.y += Math.sin(p * Math.PI) * arcHeight;
    eagle.rotation.y = Math.atan2(perchPos.x - ed.startPos.x, perchPos.z - ed.startPos.z);
    eagle.userData.wingL.rotation.x = Math.sin(t * 18) * 0.6;
    eagle.userData.wingR.rotation.x = -Math.sin(t * 18) * 0.6;
    if (p >= 1) {
      ed.state = 'perched';
      eagle.rotation.y = 1.2;
    }
  }

  // ================= BIG EAGLE — autonomous circling + nest visits =================
  const bd = bigEagle.userData;
  bd.elapsed += dt;
  const nestVisitPos = new THREE.Vector3();
  nestGroup.getWorldPosition(nestVisitPos);
  nestVisitPos.y += 0.9; // hover just above the nest, not inside it

  if (bd.state === 'circling') {
    bd.orbitAngle += dt * bd.orbitSpeed;
    bigEagle.position.set(
      Math.cos(bd.orbitAngle) * bd.orbitR,
      island.position.y + bd.height + Math.sin(t * 0.3) * 0.3,
      Math.sin(bd.orbitAngle) * bd.orbitR
    );
    const nextA = bd.orbitAngle + 0.02;
    const nx = Math.cos(nextA) * bd.orbitR, nz = Math.sin(nextA) * bd.orbitR;
    bigEagle.rotation.y = Math.atan2(nx - bigEagle.position.x, nz - bigEagle.position.z);
    // slow, mostly-gliding wings at this altitude
    bigEagle.userData.wingL.rotation.x = Math.sin(t * 1.4) * 0.15;
    bigEagle.userData.wingR.rotation.x = -Math.sin(t * 1.4) * 0.15;

    if (bd.elapsed > bd.nextVisitAt) {
      bd.state = 'toNest';
      bd.visitT = 0;
      bd.startPos = bigEagle.position.clone();
      showToast('A great eagle circles down to the nest.');
    }
  } else if (bd.state === 'toNest') {
    bd.visitT += dt;
    const dur = 1.6;
    const p = Math.min(1, bd.visitT / dur);
    bigEagle.position.lerpVectors(bd.startPos, nestVisitPos, p);
    bigEagle.position.y += Math.sin(p * Math.PI) * 0.8;
    bigEagle.rotation.y = Math.atan2(nestVisitPos.x - bd.startPos.x, nestVisitPos.z - bd.startPos.z);
    bigEagle.userData.wingL.rotation.x = Math.sin(t * 14) * 0.6;
    bigEagle.userData.wingR.rotation.x = -Math.sin(t * 14) * 0.6;
    if (p >= 1) { bd.state = 'atNest'; bd.visitT = 0; }
  } else if (bd.state === 'atNest') {
    bd.visitT += dt;
    bigEagle.position.y = nestVisitPos.y + Math.sin(t * 2) * 0.05;
    bigEagle.userData.head.rotation.x = Math.sin(t * 6) * 0.1;
    bigEagle.userData.wingL.rotation.x = Math.sin(t * 3) * 0.25;
    bigEagle.userData.wingR.rotation.x = -Math.sin(t * 3) * 0.25;
    if (bd.visitT > 1.8) {
      bd.state = 'toCircle'; bd.visitT = 0; bd.startPos = bigEagle.position.clone();
    }
  } else if (bd.state === 'toCircle') {
    bd.visitT += dt;
    const dur = 1.6;
    const p = Math.min(1, bd.visitT / dur);
    const rejoinAngle = bd.orbitAngle;
    const rejoinPos = new THREE.Vector3(
      Math.cos(rejoinAngle) * bd.orbitR,
      island.position.y + bd.height,
      Math.sin(rejoinAngle) * bd.orbitR
    );
    bigEagle.position.lerpVectors(bd.startPos, rejoinPos, p);
    bigEagle.position.y += Math.sin(p * Math.PI) * 0.6;
    bigEagle.rotation.y = Math.atan2(rejoinPos.x - bd.startPos.x, rejoinPos.z - bd.startPos.z);
    bigEagle.userData.wingL.rotation.x = Math.sin(t * 14) * 0.6;
    bigEagle.userData.wingR.rotation.x = -Math.sin(t * 14) * 0.6;
    if (p >= 1) {
      bd.state = 'circling';
      bd.elapsed = 0;
      bd.nextVisitAt = 14 + Math.random() * 12; // wait longer before the next visit
    }
  }

  updateCamera();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('load', () => {
  setTimeout(() => {
    const l = document.getElementById('loading');
    l.style.opacity = '0';
    setTimeout(() => l.style.display = 'none', 800);
  }, 500);
});
</script>
