<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Isles — Floating Dioramas</title>
  <meta name="description" content="A growing archipelago of tiny interactive floating worlds.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #c8944a;
      --ink: #2a1f14;
      --muted: rgba(42, 31, 20, 0.55);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(185deg, #b8d4f0 0%, #dce8f5 30%, #f5e8d0 65%, #f0d4a8 100%);
      cursor: grab;
      user-select: none;
    }

    body.grabbing {
      cursor: grabbing;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    #world {
      position: fixed;
      inset: 0;
      z-index: 2;
      will-change: transform;
    }

    .island-node {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: filter 0.4s ease;
    }

    .island-node:hover {
      filter: drop-shadow(0 0 22px rgba(200, 148, 74, 0.8)) drop-shadow(0 0 8px rgba(200, 148, 74, 0.4));
    }

    .island-node:hover .island-label {
      opacity: 1;
      transform: translateY(0);
    }

    .island-node:hover .island-canvas-wrap {
      transform: scale(1.07) translateY(-5px);
    }

    .island-canvas-wrap {
      position: relative;
      /* Octagon — echoes the 8-sided island top */
      clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
      overflow: hidden;
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      /* drop-shadow traces the octagon silhouette */
      filter: drop-shadow(0 6px 22px rgba(0, 0, 0, 0.28)) drop-shadow(0 2px 6px rgba(0, 0, 0, 0.18)) drop-shadow(0 0 0 1.5px rgba(255, 255, 255, 0.22));
    }

    .island-canvas-wrap canvas {
      display: block;
    }

    .island-label {
      margin-top: 16px;
      text-align: center;
      opacity: 0.7;
      transform: translateY(4px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .island-label h3 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: 0.02em;
      text-shadow: 0 1px 8px rgba(255, 255, 255, 0.8);
    }

    .island-label p {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
      text-shadow: 0 1px 4px rgba(255, 255, 255, 0.6);
    }

    /* ───── CONSTELLATION & CENTRAL ANCHOR ───── */
    #constellation-svg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1300px;
      height: 1300px;
      pointer-events: none;
      z-index: 1;
      overflow: visible;
    }

    .central-anchor {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 190px;
      height: 190px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 3;
      cursor: pointer;
      background: radial-gradient(circle at 40% 35%, rgba(255, 255, 255, 0.92) 0%, rgba(245, 232, 210, 0.82) 45%, rgba(220, 195, 155, 0.7) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow:
        0 12px 35px rgba(200, 148, 74, 0.35),
        0 4px 15px rgba(0, 0, 0, 0.1),
        inset 0 2px 4px rgba(255, 255, 255, 0.9),
        inset 0 -2px 6px rgba(180, 130, 60, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.85);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
    }

    .central-anchor:hover {
      transform: translate(-50%, -50%) scale(1.06);
      box-shadow:
        0 16px 48px rgba(200, 148, 74, 0.55),
        0 0 24px rgba(200, 148, 74, 0.4),
        inset 0 2px 6px rgba(255, 255, 255, 1);
    }

    .anchor-ring {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1px dashed rgba(200, 148, 74, 0.5);
      animation: rotateSlow 45s linear infinite;
    }

    .anchor-ring-inner {
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      border: 1px solid rgba(200, 148, 74, 0.3);
    }

    @keyframes rotateSlow {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .anchor-emblem {
      width: 32px;
      height: 32px;
      margin-bottom: 6px;
      color: var(--gold);
      filter: drop-shadow(0 2px 4px rgba(200, 148, 74, 0.4));
    }

    .anchor-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--ink);
      text-transform: uppercase;
    }

    .anchor-sub {
      font-size: 9px;
      letter-spacing: 0.28em;
      color: var(--gold);
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 2px;
    }

    #hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      padding: 4.5vh 5vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hud-top {
      max-width: 320px;
      pointer-events: none;
    }

    .hud-eyebrow {
      font-size: 10px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .hud-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(2.4rem, 4.5vw, 3.6rem);
      font-weight: 600;
      color: var(--ink);
      line-height: 0.95;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 12px rgba(255, 255, 255, 0.7);
    }

    .hud-title em {
      font-style: italic;
      font-weight: 400;
      color: #8a6238;
    }

    .hud-sub {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.55;
      text-shadow: 0 1px 6px rgba(255, 255, 255, 0.6);
    }

    .hud-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .hud-legend {
      display: flex;
      gap: 20px;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      text-shadow: 0 1px 4px rgba(255, 255, 255, 0.6);
    }

    .hud-controls {
      display: flex;
      align-items: center;
      gap: 14px;
      pointer-events: auto;
    }

    #music-btn {
      background: rgba(255, 255, 255, 0.42);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.55);
      padding: 6px 14px;
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    #music-btn:hover {
      background: rgba(255, 255, 255, 0.75);
      transform: translateY(-1px);
    }

    #music-btn.muted {
      opacity: 0.65;
      text-decoration: line-through;
    }

    #diorama-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #000;
      display: none;
      flex-direction: column;
    }

    #diorama-overlay.entering {
      display: flex;
      animation: overlayIn 0.55s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    #diorama-overlay.visible {
      display: flex;
    }

    #diorama-overlay.leaving {
      display: flex;
      animation: overlayOut 0.4s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    @keyframes overlayIn {
      from {
        opacity: 0;
        transform: scale(0.97);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes overlayOut {
      from {
        opacity: 1;
        transform: scale(1);
      }

      to {
        opacity: 0;
        transform: scale(1.02);
      }
    }

    #diorama-frame {
      flex: 1;
      border: none;
      display: block;
      width: 100%;
      height: 100%;
    }

    #back-btn {
      position: absolute;
      top: 28px;
      right: 36px;
      left: auto;
      z-index: 101;
      background: rgba(18, 22, 28, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 10px 20px 10px 14px;
      border-radius: 100px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
      transition: background 0.25s ease, transform 0.25s ease, border-color 0.25s ease;
      pointer-events: auto;
    }

    #back-btn:hover {
      background: rgba(18, 22, 28, 0.85);
      border-color: rgba(255, 255, 255, 0.65);
      transform: translateY(-2px);
    }

    #back-btn svg {
      width: 14px;
      height: 14px;
    }

    #island-count {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(255, 255, 255, 0.6);
    }

    #veil {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: linear-gradient(185deg, #b8d4f0 0%, #f5e8d0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      transition: opacity 0.8s ease;
    }

    #veil.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .veil-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.4rem;
      color: var(--ink);
      font-style: italic;
      letter-spacing: 0.05em;
    }

    .veil-dots {
      display: flex;
      gap: 8px;
    }

    .veil-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      animation: dotPulse 1.4s ease-in-out infinite;
    }

    .veil-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .veil-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes dotPulse {

      0%,
      80%,
      100% {
        opacity: 0.2;
        transform: scale(0.8);
      }

      40% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    #enter-hint {
      position: fixed;
      bottom: 14vh;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      font-size: 13px;
      font-style: italic;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(10px);
      padding: 9px 22px;
      border-radius: 100px;
      opacity: 0;
      transition: opacity 0.6s ease, transform 0.6s ease;
      z-index: 9;
      pointer-events: none;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    #enter-hint.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

<body>

  <canvas id="bg-canvas"></canvas>
  <div id="world"></div>

  <div id="hud">
    <div class="hud-top">
      <div class="hud-eyebrow">A Collection of Worlds</div>
      <h1 class="hud-title">The <em>Isles</em></h1>
      <p class="hud-sub">A growing archipelago of tiny interactive worlds.</p>
    </div>
    <div class="hud-bottom">
      <div class="hud-legend">
        <span>Drag &middot; Explore</span>
        <span>Click &middot; Enter</span>
        <span>Scroll &middot; Zoom</span>
      </div>
      <div class="hud-controls">
        <button id="music-btn" aria-label="Toggle background music">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
          <span id="music-status">Music</span>
        </button>
        <div id="island-count">8 Islands</div>
      </div>
    </div>
  </div>

  <div id="enter-hint"></div>

  <div id="diorama-overlay">
    <button id="back-btn">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M9 2L4 7l5 5" />
      </svg>
      Back to The Isles
    </button>
    <iframe id="diorama-frame" src="" title="Diorama"></iframe>
  </div>

  <div id="veil">
    <div class="veil-title">The Isles</div>
    <div class="veil-dots">
      <div class="veil-dot"></div>
      <div class="veil-dot"></div>
      <div class="veil-dot"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    'use strict';

    // ═══════════════════════════════════════════════════════
    // ISLAND REGISTRY (Harmonious 8-Point Radial Octagon)
    // ═══════════════════════════════════════════════════════
    // Radius R = 460px from central anchor
    const RING_RADIUS = 460;
    const DIAGONAL_OFFSET = Math.round(RING_RADIUS * Math.SQRT1_2); // ~325px

    const ISLANDS = [
      { id: 'polar-caps', file: 'polar-caps-diorama.html', name: 'Polar Caps', tagline: 'Frozen Silence', size: 215, wx: 0, wy: -RING_RADIUS, bg: 0xd0e4f0, buildFn: 'buildPolarCaps' },
      { id: 'silvane', file: 'silvane-diorama.html', name: 'Silvane', tagline: 'Woodland at Dusk', size: 225, wx: DIAGONAL_OFFSET, wy: -DIAGONAL_OFFSET, bg: 0x5a6070, buildFn: 'buildSilvane' },
      { id: 'ocean', file: 'ocean-diorama.html', name: 'Ocean', tagline: 'The Deep Reef', size: 220, wx: RING_RADIUS, wy: 0, bg: 0x0e3a52, buildFn: 'buildOcean' },
      { id: 'bird-paradise', file: 'bird-paradise-diorama.html', name: 'Bird Paradise', tagline: 'Tropical Canopy', size: 225, wx: DIAGONAL_OFFSET, wy: DIAGONAL_OFFSET, bg: 0x7ab8d4, buildFn: 'buildBirdParadise' },
      { id: 'lake-koi', file: 'lake-koi-diorama.html', name: 'Lake and Koi', tagline: 'Still Waters', size: 215, wx: 0, wy: RING_RADIUS, bg: 0xd4c0a0, buildFn: 'buildLakeKoi' },
      { id: 'barnyard', file: 'barnyard-diorama.html', name: 'Barnyard', tagline: 'Golden Afternoon', size: 215, wx: -DIAGONAL_OFFSET, wy: DIAGONAL_OFFSET, bg: 0xb8c898, buildFn: 'buildBarnyard' },
      { id: 'desert', file: 'desert-diorama.html', name: 'Desert', tagline: 'Scorched and Still', size: 215, wx: -RING_RADIUS, wy: 0, bg: 0xd4a860, buildFn: 'buildDesert' },
      { id: 'rainforest', file: 'rainforest-diorama.html', name: 'Rainforest', tagline: 'Verdant Depths', size: 220, wx: -DIAGONAL_OFFSET, wy: -DIAGONAL_OFFSET, bg: 0x2a4830, buildFn: 'buildRainforest' },
    ];

    // ═══════════════════════════════════════════════════════
    // BACKGROUND CANVAS
    // ═══════════════════════════════════════════════════════
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    function resizeBg() { bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; }
    resizeBg();
    window.addEventListener('resize', resizeBg);

    const clouds = Array.from({ length: 18 }, () => ({
      x: Math.random() * 3000 - 1500,
      y: Math.random() * window.innerHeight * 0.55,
      w: 120 + Math.random() * 220, h: 40 + Math.random() * 60,
      opacity: 0.15 + Math.random() * 0.25,
      speed: 0.04 + Math.random() * 0.06,
      phase: Math.random() * Math.PI * 2,
    }));

    function drawCloud(x, y, w, h, opacity) {
      bgCtx.save(); bgCtx.globalAlpha = opacity; bgCtx.fillStyle = '#ffffff';
      for (let i = 0; i < 5; i++) {
        const cx = x + (i / 4) * w;
        const cy = y + Math.sin(i / 4 * Math.PI) * h * 0.5;
        const r = h * (0.5 + Math.sin(i / 4 * Math.PI) * 0.35);
        bgCtx.beginPath(); bgCtx.arc(cx, cy, r, 0, Math.PI * 2); bgCtx.fill();
      }
      bgCtx.restore();
    }

    let bgT = 0;
    function drawBg(px, py) {
      bgT += 0.008;
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      const grad = bgCtx.createLinearGradient(0, 0, 0, bgCanvas.height);
      grad.addColorStop(0, '#a8c8e8'); grad.addColorStop(0.35, '#d0e4f5');
      grad.addColorStop(0.7, '#f0e4cc'); grad.addColorStop(1, '#e8d4a8');
      bgCtx.fillStyle = grad; bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
      const sg = bgCtx.createRadialGradient(bgCanvas.width * 0.72, bgCanvas.height * 0.62, 0, bgCanvas.width * 0.72, bgCanvas.height * 0.62, 280);
      sg.addColorStop(0, 'rgba(255,220,140,0.28)'); sg.addColorStop(0.4, 'rgba(255,190,80,0.10)'); sg.addColorStop(1, 'rgba(255,180,60,0)');
      bgCtx.fillStyle = sg; bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
      const hg = bgCtx.createLinearGradient(0, bgCanvas.height * 0.55, 0, bgCanvas.height);
      hg.addColorStop(0, 'rgba(255,240,210,0)'); hg.addColorStop(1, 'rgba(255,235,200,0.3)');
      bgCtx.fillStyle = hg; bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
      clouds.forEach(c => {
        const sx = c.x + px * 0.12 + Math.sin(bgT * c.speed + c.phase) * 18;
        drawCloud(sx, c.y + py * 0.06, c.w, c.h, c.opacity);
      });
      const vg = bgCtx.createRadialGradient(bgCanvas.width / 2, bgCanvas.height / 2, bgCanvas.width * 0.2, bgCanvas.width / 2, bgCanvas.height / 2, bgCanvas.width * 0.85);
      vg.addColorStop(0, 'rgba(255,240,220,0)'); vg.addColorStop(1, 'rgba(200,180,150,0.18)');
      bgCtx.fillStyle = vg; bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
    }

    // ═══════════════════════════════════════════════════════
    // PAN / DRAG STATE
    // ═══════════════════════════════════════════════════════
    let panX = 0, panY = 0;
    let dragStart = null, panStart = null;
    let isDragging = false;
    let vel = { x: 0, y: 0 };
    let lastPos = null, lastTime = 0;
    // Initial scale fits full 8-island constellation in standard viewports
    let worldScale = Math.min(0.95, Math.max(0.6, (window.innerHeight - 80) / 1080));
    const MIN_SCALE = 0.45, MAX_SCALE = 1.6;
    const world = document.getElementById('world');

    function applyTransform() {
      world.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + worldScale + ')';
    }
    applyTransform();

    document.addEventListener('mousedown', e => {
      if (e.target.closest('#diorama-overlay')) return;
      dragStart = { x: e.clientX, y: e.clientY };
      panStart = { x: panX, y: panY };
      isDragging = false;
      lastPos = { x: e.clientX, y: e.clientY };
      lastTime = performance.now();
      vel = { x: 0, y: 0 };
      document.body.classList.add('grabbing');
    });

    document.addEventListener('mousemove', e => {
      if (!dragStart) return;
      const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
      if (!isDragging && Math.hypot(dx, dy) > 4) isDragging = true;
      if (isDragging) {
        const now = performance.now(), dt = now - lastTime;
        if (dt > 0) { vel.x = (e.clientX - lastPos.x) / dt * 16; vel.y = (e.clientY - lastPos.y) / dt * 16; }
        lastPos = { x: e.clientX, y: e.clientY }; lastTime = now;
        panX = panStart.x + dx; panY = panStart.y + dy; applyTransform();
      }
    });

    document.addEventListener('mouseup', e => {
      document.body.classList.remove('grabbing');
      if (!isDragging) {
        const node = e.target.closest('.island-node');
        if (node) openDiorama(node.dataset.file, node.dataset.name);
      }
      dragStart = null; isDragging = false;
    });

    // Touch
    let tx0, ty0, tpx0, tpy0;
    document.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return;
      const t = e.touches[0];
      tx0 = t.clientX; ty0 = t.clientY; tpx0 = panX; tpy0 = panY;
      lastPos = { x: t.clientX, y: t.clientY }; lastTime = performance.now();
      vel = { x: 0, y: 0 }; isDragging = false;
      dragStart = { x: t.clientX, y: t.clientY };
    }, { passive: true });

    document.addEventListener('touchmove', e => {
      if (e.touches.length !== 1) return;

    function makeMini(canvas, bgColor, buildIsland) {

      const islandGroup = buildIsland(m, mk, trail);

    }

  <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#c8944a" stop-opacity="0.25"/>
    <stop offset="60%" stop-color="#c8944a" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#c8944a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="spokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#c8944a" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#c8944a" stop-opacity="0.15"/>
  </linearGradient>
`;
    svg.appendChild(defs);

    // Orbital Concentric Rings
    [150, 305, RING_RADIUS].forEach((r, idx) => {
      const circle = document.createElementNS(svgNS, "circle");
      circle.setAttribute("cx", cx);
      circle.setAttribute("cy", cy);
      circle.setAttribute("r", r);
      circle.setAttribute("fill", "none");
      circle.setAttribute("stroke", idx === 2 ? "rgba(200, 148, 74, 0.4)" : "rgba(200, 148, 74, 0.22)");
      circle.setAttribute("stroke-width", idx === 2 ? "1.5" : "1");
      circle.setAttribute("stroke-dasharray", idx === 2 ? "6 8" : (idx === 1 ? "4 6" : "3 5"));
      svg.appendChild(circle);
    });

    // Connecting Octagon Constellation Path
    const octPoints = ISLANDS.map(isl => `${cx + isl.wx},${cy + isl.wy}`).join(" ");
    const octPolygon = document.createElementNS(svgNS, "polygon");
    octPolygon.setAttribute("points", octPoints);
    octPolygon.setAttribute("fill", "rgba(200, 148, 74, 0.035)");
    octPolygon.setAttribute("stroke", "rgba(200, 148, 74, 0.35)");
    octPolygon.setAttribute("stroke-width", "1.2");
    octPolygon.setAttribute("stroke-dasharray", "8 6");
    svg.appendChild(octPolygon);

    // Radiant Spokes from Center to each Island
    ISLANDS.forEach(isl => {
      const line = document.createElementNS(svgNS, "line");
      line.setAttribute("x1", cx);
      line.setAttribute("y1", cy);
      line.setAttribute("x2", cx + isl.wx);
      line.setAttribute("y2", cy + isl.wy);
      line.setAttribute("stroke", "rgba(200, 148, 74, 0.28)");
      line.setAttribute("stroke-width", "1");
      line.setAttribute("stroke-dasharray", "4 4");
      svg.appendChild(line);

      // Island Node Anchor Glow on SVG
      const nodeDot = document.createElementNS(svgNS, "circle");
      nodeDot.setAttribute("cx", cx + isl.wx);
      nodeDot.setAttribute("cy", cy + isl.wy);
      nodeDot.setAttribute("r", "110");
      nodeDot.setAttribute("fill", "none");
      nodeDot.setAttribute("stroke", "rgba(200, 148, 74, 0.18)");
      nodeDot.setAttribute("stroke-width", "1");
      svg.appendChild(nodeDot);
    });

    world.appendChild(svg);

    // 2. Central Anchor Circle
    const centralAnchor = document.createElement('div');
    centralAnchor.className = 'central-anchor';
    centralAnchor.innerHTML = `
  <div class="anchor-ring"></div>
  <div class="anchor-ring-inner"></div>
  <svg class="anchor-emblem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <polygon points="12 2 15 9 22 12 15 15 12 22 9 15 2 12 9 9"/>
    <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
  </svg>
  <div class="anchor-title">The Isles</div>
  <div class="anchor-sub">Realm Core</div>
`;
    centralAnchor.addEventListener('mouseenter', () => showHint("the Central Realm Anchor (Click to Recenter)"));
    centralAnchor.addEventListener('mouseleave', () => hideHint());
    centralAnchor.addEventListener('click', (e) => {
      e.stopPropagation();
      panX = 0; panY = 0; worldScale = 1.0;
      applyTransform();
      showHint("View Centered");
      setTimeout(hideHint, 1200);
    });
    world.appendChild(centralAnchor);

    // 3. Build Island DOM Nodes + Mini 3D Scenes
    let readyCount = 0;
    ISLANDS.forEach(island => {
      const node = document.createElement('div');
      node.className = 'island-node';
      node.dataset.file = island.file;
      node.dataset.name = island.name;
      node.style.left = 'calc(50% + ' + island.wx + 'px)';
      node.style.top = 'calc(50% + ' + island.wy + 'px)';

      const wrap = document.createElement('div');
      wrap.className = 'island-canvas-wrap';
      wrap.style.width = island.size + 'px';
      wrap.style.height = island.size + 'px';

      const canvas = document.createElement('canvas');
      canvas.width = island.size; canvas.height = island.size;
      wrap.appendChild(canvas); node.appendChild(wrap);

      const label = document.createElement('div');
      label.className = 'island-label';
      label.innerHTML = '<h3>' + island.name + '</h3><p>' + island.tagline + '</p>';
      node.appendChild(label);

      node.addEventListener('mouseenter', () => showHint(island.name));
      node.addEventListener('mouseleave', () => hideHint());
      world.appendChild(node);

      setTimeout(() => {
        makeMini(canvas, island.bg, BUILD_FNS[island.buildFn]);
        readyCount++;
        if (readyCount === ISLANDS.length) revealHub();
      }, 80 + ISLANDS.indexOf(island) * 40);
    });

    function revealHub() {
      const veil = document.getElementById('veil');
      veil.classList.add('hidden');
      setTimeout(() => { veil.style.display = 'none'; }, 1000);
    }

    // ═══════════════════════════════════════════════════════
    // MAIN LOOP
    // ═══════════════════════════════════════════════════════
    function mainLoop(ts) {
      requestAnimationFrame(mainLoop);
      const t = ts * 0.001;

      // Gentle float on each island node in the ring
      document.querySelectorAll('.island-node').forEach((node, i) => {
        const bobY = Math.sin(t * 0.6 + i * (Math.PI / 4)) * 7;
        node.style.transform = 'translate(-50%, calc(-50% + ' + bobY + 'px))';
      });

      // Gentle rhythmic pulse on center anchor
      if (centralAnchor) {
        const anchorBob = Math.sin(t * 0.8) * 4;
        centralAnchor.style.transform = 'translate(-50%, calc(-50% + ' + anchorBob + 'px))';
      }

      applyInertia();
      drawBg(panX, panY);
    }
    requestAnimationFrame(mainLoop);

    // ═══════════════════════════════════════════════════════
    // BACKGROUND MUSIC PLAYLIST (music1 @ 0.5x -> music2 @ 1.0x -> Loop)
    // ═══════════════════════════════════════════════════════
    const PLAYLIST = [
      { src: 'music1.mp3', rate: 0.5, title: 'Music 1' },
      { src: 'music2.mp3', rate: 1.0, title: 'Music 2' }
    ];

    let currentTrack = 0;
    let isAudioActive = true;
    let hasUserInteracted = false;

    const bgAudio = new Audio();
    bgAudio.preload = 'auto';

    function playCurrentTrack() {
      const track = PLAYLIST[currentTrack];
      bgAudio.src = track.src;
      bgAudio.playbackRate = track.rate;
      bgAudio.volume = isAudioActive ? 0.65 : 0;

      if (isAudioActive) {
        const p = bgAudio.play();
        if (p !== undefined) {
          p.catch(() => {
            // Browser prevented autoplay before interaction
          });
        }
      }
      updateMusicUI();
    }

    // When track finishes, switch to next track and set its speed
    bgAudio.addEventListener('ended', () => {
      currentTrack = (currentTrack + 1) % PLAYLIST.length;
      playCurrentTrack();
    });

    // Auto-start on first user interaction anywhere
    function startAudioOnFirstAction() {
      if (!hasUserInteracted) {
        hasUserInteracted = true;
        currentTrack = 0; // Starts with music1 at 0.5x
        playCurrentTrack();
      }
    }

    ['click', 'touchstart', 'mousedown', 'keydown', 'wheel'].forEach(evt => {
      window.addEventListener(evt, startAudioOnFirstAction, { once: true, passive: true });
    });

    // Music UI Button
    const musicBtn = document.getElementById('music-btn');
    const musicStatus = document.getElementById('music-status');

    function updateMusicUI() {
      if (!musicBtn || !musicStatus) return;
      if (!isAudioActive || bgAudio.paused) {
        musicBtn.classList.add('muted');
        musicStatus.textContent = 'Muted';
      } else {
        musicBtn.classList.remove('muted');
        musicStatus.textContent = 'Music';
      }
    }

    if (musicBtn) {
      musicBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        hasUserInteracted = true;
        if (isAudioActive && !bgAudio.paused) {
          isAudioActive = false;
          bgAudio.pause();
        } else {
          isAudioActive = true;
          if (!bgAudio.src || bgAudio.ended) {
            playCurrentTrack();
          } else {
            bgAudio.volume = 0.65;
            bgAudio.playbackRate = PLAYLIST[currentTrack].rate;
            bgAudio.play().catch(() => { });
          }
        }
        updateMusicUI();
      });
    }
  </script>
</body>

</html>
